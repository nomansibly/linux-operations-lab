name: Linux lab checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  lab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Full integration demonstration
        run: python scripts/complete_demo.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lab-evidence
          path: runtime/
